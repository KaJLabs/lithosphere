# Lithosphere CI — Quality Gate Pipeline
# Parallel jobs: build, lint, test, typecheck, gitleaks

name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'Makalu/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'Makalu/**'
      - '.github/workflows/ci.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Secret Scanning (runs in parallel, no dependencies)
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────────────────────────────
  # Install + Build (required by test and typecheck)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: Makalu/**/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-modules-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turbo)
        run: pnpm turbo run build --filter='...[origin/main]'

      - name: Upload Turbo Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-build-summary
          path: Makalu/.turbo/runs
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Lint (parallel with build — no build dependency needed)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Turbo)
        run: pnpm turbo run lint --filter='...[origin/main]'

  # ─────────────────────────────────────────────────────────────────────
  # Test (after build — tests may require compiled output)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Turbo) with coverage
        # Advisory until Phase 6 coverage matures — failures visible in logs and summary,
        # but don't block PRs. Flip to false once api/indexer/explorer reach baseline coverage.
        continue-on-error: true
        run: pnpm turbo run test:coverage --filter='...[origin/main]' --continue
        env:
          CI: true

      # Explorer is a sibling Next.js project, not a workspace member (it has its
      # own lockfile + node_modules). Run its tests directly.
      - name: Explorer tests with coverage
        continue-on-error: true
        working-directory: ./Makalu/explorer
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            pnpm install --frozen-lockfile
            pnpm test:coverage
          else
            echo "explorer has no test script, skipping"
          fi

      # ── Build a combined Test + Coverage summary ──────────────────────────
      # Output goes to two places: $GITHUB_STEP_SUMMARY (visible on every run)
      # and /tmp/pr-summary.md (consumed by the PR-comment step below). One
      # source of truth → both surfaces stay in sync.
      - name: Build Test + Coverage Summary
        if: always()
        id: build-summary
        run: |
          SUMMARY=/tmp/pr-summary.md
          : > "$SUMMARY"

          echo "## Test Results" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Package  | Passed | Failed | Skipped | Total | Duration |" >> "$SUMMARY"
          echo "|----------|-------:|-------:|--------:|------:|---------:|" >> "$SUMMARY"
          for pkg in api indexer explorer; do
            results="$pkg/test-results.json"
            if [ -f "$results" ]; then
              passed=$(jq -r '.numPassedTests' "$results")
              failed=$(jq -r '.numFailedTests' "$results")
              skipped=$(jq -r '.numPendingTests' "$results")
              total=$(jq -r '.numTotalTests' "$results")
              # JSON reports startTime/endTime in ms epoch — compute duration in seconds.
              duration_ms=$(jq -r '(.endTime // 0) - (.startTime // 0)' "$results")
              duration=$(awk -v ms="$duration_ms" 'BEGIN { printf "%.1fs", ms/1000 }')
              echo "| $pkg | $passed | $failed | $skipped | $total | $duration |" >> "$SUMMARY"
            else
              echo "| $pkg | _no results_ | | | | |" >> "$SUMMARY"
            fi
          done

          echo "" >> "$SUMMARY"
          echo "## Coverage" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Package  | Stmts % | Branch % | Funcs % | Lines % |" >> "$SUMMARY"
          echo "|----------|--------:|---------:|--------:|--------:|" >> "$SUMMARY"
          for pkg in api indexer explorer; do
            cov="$pkg/coverage/coverage-summary.json"
            if [ -f "$cov" ]; then
              stmts=$(jq -r '.total.statements.pct' "$cov")
              branch=$(jq -r '.total.branches.pct' "$cov")
              funcs=$(jq -r '.total.functions.pct' "$cov")
              lines=$(jq -r '.total.lines.pct' "$cov")
              echo "| $pkg | $stmts | $branch | $funcs | $lines |" >> "$SUMMARY"
            else
              echo "| $pkg | _no coverage_ | | | |" >> "$SUMMARY"
            fi
          done

          echo "" >> "$SUMMARY"
          echo "<sub>Generated by [\`ci.yaml\`](../actions/runs/${{ github.run_id }}) for \`${{ github.sha }}\`. Test JSON + coverage HTML are uploaded as run artifacts.</sub>" >> "$SUMMARY"

          # Also write into the GitHub Actions step summary so the run page shows it.
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # ── Quarantine post-processor ─────────────────────────────────────────
      # Splits vitest failures into "real" vs "quarantined" (entries in
      # .test-quarantine.yaml). Real failures exit non-zero; quarantined ones
      # are surfaced as warnings + appended to /tmp/pr-summary.md so reviewers
      # see the noise without it blocking the PR. Stale entries (>30d) emit
      # ::warning:: annotations as a reminder to fix-or-retire.
      - name: Process test results against quarantine
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/process-test-results.mjs

      # ── Post / update sticky PR comment ──────────────────────────────────
      # Only on pull_request triggers. Replaces the prior comment instead of
      # spamming a new one each push, so the PR conversation stays readable.
      # Runs AFTER the quarantine processor so the "Quarantined Failures"
      # subtable is included in the same sticky comment.
      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-test-summary
          path: /tmp/pr-summary.md

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            Makalu/api/coverage/
            Makalu/indexer/coverage/
            Makalu/explorer/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Upload vitest JSON for the flake tracker. scripts/flake-tracker.sh
      # consumes these across the last N runs to find tests with mixed pass/fail.
      - name: Upload test-results JSON (for flake tracker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            Makalu/api/test-results.json
            Makalu/indexer/test-results.json
            Makalu/explorer/test-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Typecheck (after build — needs compiled dependencies)
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Turbo)
        run: pnpm turbo run typecheck --filter='...[origin/main]'
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # License Check — enforces .license-policy.yaml against the prod
  # dependency tree. Catches copyleft/source-available licenses being
  # pulled in transitively before they ship in the SDK.
  # ─────────────────────────────────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Run license policy check
        run: node scripts/check-licenses.mjs

  # ─────────────────────────────────────────────────────────────────────
  # GraphQL Schema Drift Gate — fail if docs/api-reference/schema.graphql
  # doesn't match what re-printing src/schema.ts produces. Prevents
  # shipping an api whose machine-readable schema is silently stale.
  # ─────────────────────────────────────────────────────────────────────
  schema-sync-check:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Verify GraphQL schema is in sync
        run: pnpm run verify-schema-in-sync
