# Lithosphere CI — Quality Gate Pipeline
# Parallel jobs: build, lint, test, typecheck, gitleaks

name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'Makalu/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'Makalu/**'
      - '.github/workflows/ci.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Secret Scanning (runs in parallel, no dependencies)
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────────────────────────────
  # Install + Build (required by test and typecheck)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: Makalu/**/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-modules-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turbo)
        run: pnpm turbo run build --filter='...[origin/main]'

      - name: Upload Turbo Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-build-summary
          path: Makalu/.turbo/runs
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Lint (parallel with build — no build dependency needed)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Turbo)
        run: pnpm turbo run lint --filter='...[origin/main]'

  # ─────────────────────────────────────────────────────────────────────
  # Test (after build — tests may require compiled output)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Turbo) with coverage
        # Advisory until Phase 6 coverage matures — failures visible in logs and summary,
        # but don't block PRs. Flip to false once api/indexer/explorer reach baseline coverage.
        continue-on-error: true
        run: pnpm turbo run test:coverage --filter='...[origin/main]' --continue
        env:
          CI: true

      # Explorer is a sibling Next.js project, not a workspace member (it has its
      # own lockfile + node_modules). Run its tests directly.
      - name: Explorer tests with coverage
        continue-on-error: true
        working-directory: ./Makalu/explorer
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            pnpm install --frozen-lockfile
            pnpm test:coverage
          else
            echo "explorer has no test script, skipping"
          fi

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Test & Coverage Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Stmts % | Branch % | Funcs % | Lines % |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------:|---------:|--------:|--------:|" >> $GITHUB_STEP_SUMMARY
          for pkg in api indexer explorer; do
            summary="$pkg/coverage/coverage-summary.json"
            if [ -f "$summary" ]; then
              stmts=$(jq -r '.total.statements.pct' "$summary")
              branch=$(jq -r '.total.branches.pct' "$summary")
              funcs=$(jq -r '.total.functions.pct' "$summary")
              lines=$(jq -r '.total.lines.pct' "$summary")
              echo "| $pkg | $stmts | $branch | $funcs | $lines |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $pkg | _no coverage_ | | | |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            Makalu/api/coverage/
            Makalu/indexer/coverage/
            Makalu/explorer/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Upload vitest JSON for the flake tracker. scripts/flake-tracker.sh
      # consumes these across the last N runs to find tests with mixed pass/fail.
      - name: Upload test-results JSON (for flake tracker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            Makalu/api/test-results.json
            Makalu/indexer/test-results.json
            Makalu/explorer/test-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Typecheck (after build — needs compiled dependencies)
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Turbo)
        run: pnpm turbo run typecheck --filter='...[origin/main]'
        continue-on-error: true
