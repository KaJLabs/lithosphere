# Lithosphere CI — SDK Pipeline
# Build, test, lint, typecheck on Node LTS matrix (18, 20, 22)

name: CI SDK

on:
  push:
    branches: [main]
    paths:
      - 'Makalu/templates/sdk-template/**'
      - 'Makalu/packages/**'
      - '.github/workflows/ci-sdk.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Makalu/templates/sdk-template/**'
      - 'Makalu/packages/**'
      - '.github/workflows/ci-sdk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: SDK — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    # Operate from the workspace root, NOT the template subdir. The template
    # declares `@lithosphere/sdk: workspace:*`, so its tsup build needs the
    # dist/ of @lithosphere/sdk (and transitively @lithosphere/blockchain-core)
    # to already exist for type imports to resolve. Running pnpm from the
    # subdir doesn't trigger upstream builds. Turbo's `^build` dependency in
    # Makalu/turbo.json takes care of the build order via `--filter`.
    defaults:
      run:
        working-directory: ./Makalu

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's `--filter @lithosphere/sdk-template` honours the `^build`
      # task dependency, so this single invocation builds
      # @lithosphere/blockchain-core → @lithosphere/sdk → @lithosphere/sdk-template
      # in topological order. The previous CI ran `pnpm build` from the
      # template dir, which produced TS2307 ("Cannot find module
      # @lithosphere/sdk") because the upstream dist wasn't there yet.
      - name: Build SDK packages + template (topological)
        run: pnpm turbo run build --filter @lithosphere/sdk-template

      - name: Test
        run: pnpm --filter @lithosphere/sdk-template test
        env:
          CI: true

      # Blocking after 2026-05-12 (P2 closure). The sdk-template scaffold is
      # small and stable; any lint failure here is a real signal worth
      # blocking the build for. Bundle-size below stays advisory because
      # no budget is set yet — flip blocking when a budget lands.
      - name: Lint
        run: pnpm --filter @lithosphere/sdk-template lint

      - name: Typecheck
        run: pnpm --filter @lithosphere/sdk-template typecheck

      - name: Test Summary
        if: always()
        run: |
          echo "## SDK Tests — Node ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: completed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: completed" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: completed" >> $GITHUB_STEP_SUMMARY

  size-check:
    name: SDK — Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages + template (topological)
        run: pnpm turbo run build --filter @lithosphere/sdk-template

      - name: Check bundle size
        run: pnpm --filter @lithosphere/sdk-template size
        continue-on-error: true
