# Lithosphere CI — Smart Contract Pipeline
# Compile, test, lint, gas report, static analysis (Slither), ABI export

name: CI Contracts

on:
  push:
    branches: [main]
    paths:
      - 'Makalu/contracts/**'
      - 'Makalu/templates/contracts-template/**'
      - '.github/workflows/ci-contracts.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Makalu/contracts/**'
      - 'Makalu/templates/contracts-template/**'
      - '.github/workflows/ci-contracts.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Compile contracts and cache artifacts for downstream jobs
  # ─────────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile with Hardhat
        run: pnpm compile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            Makalu/contracts/artifacts/
            Makalu/contracts/cache/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Run contract tests (Makalu/contracts + contracts-template)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install — contracts
        working-directory: ./Makalu/contracts
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Test — contracts
        working-directory: ./Makalu/contracts
        run: pnpm test
        env:
          CI: true

      - name: Install — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Test — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm test
        env:
          CI: true

      - name: Test Summary
        if: always()
        run: |
          echo "## Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "- contracts: completed" >> $GITHUB_STEP_SUMMARY
          echo "- contracts-template: completed" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────
  # Solidity linting with solhint
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint Solidity
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm lint
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # Gas report (Hardhat gas reporter)
  # ─────────────────────────────────────────────────────────────────────
  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/templates/contracts-template
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run tests with gas reporting
        run: pnpm test
        env:
          REPORT_GAS: 'true'
          CI: 'true'

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: Makalu/templates/contracts-template/gas-report.txt
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Solidity test coverage (hardhat solidity-coverage)
  # ─────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      # solidity-coverage is bundled inside @nomicfoundation/hardhat-toolbox
      - name: Run solidity-coverage
        # Coverage will sometimes fail on optimizer settings or memory limits;
        # treat the gate as advisory until baseline coverage is established.
        continue-on-error: true
        run: pnpm test:coverage

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            stmts=$(jq -r '.total.statements.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            branch=$(jq -r '.total.branches.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            funcs=$(jq -r '.total.functions.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            lines=$(jq -r '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            echo "## Solidity Coverage (Makalu/contracts)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Stmts % | Branch % | Funcs % | Lines % |" >> $GITHUB_STEP_SUMMARY
            echo "|--------:|---------:|--------:|--------:|" >> $GITHUB_STEP_SUMMARY
            echo "| $stmts | $branch | $funcs | $lines |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Solidity Coverage" >> $GITHUB_STEP_SUMMARY
            echo "_No coverage-summary.json found._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: |
            Makalu/contracts/coverage/
            Makalu/contracts/coverage.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Static analysis with Slither
  # ─────────────────────────────────────────────────────────────────────
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: compile
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./Makalu/templates/contracts-template
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile contracts (required by Slither)
        run: npx hardhat compile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        run: slither . --config-file .slither.config.json || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Makalu/templates/contracts-template/slither-report.sarif
        continue-on-error: true

      - name: Upload Slither JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            Makalu/templates/contracts-template/slither-report.json
            Makalu/templates/contracts-template/slither-report.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Export compiled ABIs as build artifacts
  # ─────────────────────────────────────────────────────────────────────
  abi-export:
    name: ABI Export
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile
        run: pnpm compile

      - name: Extract ABIs
        run: |
          mkdir -p abi-export
          for f in artifacts/contracts/src/*.sol/*.json; do
            [ -f "$f" ] || continue
            # Skip .dbg.json files
            [[ "$f" == *.dbg.json ]] && continue
            name=$(basename "$f" .json)
            node -e "const a=JSON.parse(require('fs').readFileSync('$f','utf8'));require('fs').writeFileSync('abi-export/${name}.abi.json',JSON.stringify(a.abi,null,2))"
            echo "Exported: ${name}.abi.json"
          done

      - name: Upload ABIs
        uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: Makalu/contracts/abi-export/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────
  # ABI Drift Gate — fail if the SDK's vendored ABIs don't match the
  # freshly compiled contract artifacts. Prevents shipping an
  # @lithosphere/blockchain-core release that's out of sync with the
  # Solidity source. Fix-it instructions are in the failure log.
  # ─────────────────────────────────────────────────────────────────────
  abi-sync-check:
    name: ABI Sync Check
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile
        run: pnpm compile

      - name: Sync ABIs from artifacts to SDK
        run: pnpm run sync-abis

      - name: Verify no drift
        run: |
          # Print any drift before failing so the log shows what changed.
          if ! git diff --exit-code -- ../packages/blockchain-core/src/abis/; then
            echo ""
            echo "::error::ABI drift detected: @lithosphere/blockchain-core ships ABIs that don't match the compiled Solidity sources."
            echo ""
            echo "To fix:"
            echo "  cd Makalu/contracts"
            echo "  pnpm run sync-abis"
            echo "  git add ../packages/blockchain-core/src/abis/"
            echo "  git commit -m 'chore(sdk): re-sync ABIs from contracts'"
            exit 1
          fi
          echo "ABIs in sync."
