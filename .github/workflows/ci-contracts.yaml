# Lithosphere CI — Smart Contract Pipeline
# Compile, test, lint, gas report, static analysis (Slither), ABI export

name: CI Contracts

on:
  push:
    branches: [main]
    paths:
      - 'Makalu/contracts/**'
      - 'Makalu/templates/contracts-template/**'
      - '.github/workflows/ci-contracts.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Makalu/contracts/**'
      - 'Makalu/templates/contracts-template/**'
      - '.github/workflows/ci-contracts.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Compile contracts and cache artifacts for downstream jobs
  # ─────────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile with Hardhat
        run: pnpm compile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            Makalu/contracts/artifacts/
            Makalu/contracts/cache/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Run contract tests (Makalu/contracts + contracts-template)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install — contracts
        working-directory: ./Makalu/contracts
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Test — contracts
        working-directory: ./Makalu/contracts
        run: pnpm test
        env:
          CI: true

      - name: Install — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Test — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm test
        env:
          CI: true

      - name: Test Summary
        if: always()
        run: |
          echo "## Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "- contracts: completed" >> $GITHUB_STEP_SUMMARY
          echo "- contracts-template: completed" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────
  # Solidity linting with solhint
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install — contracts-template
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint Solidity
        # Flipped from advisory to blocking 2026-05-12 after multiple green
        # runs in a row. Solhint findings now gate the contracts pipeline
        # like every other lint job.
        working-directory: ./Makalu/templates/contracts-template
        run: pnpm lint

  # ─────────────────────────────────────────────────────────────────────
  # Gas report (Hardhat gas reporter)
  # ─────────────────────────────────────────────────────────────────────
  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/templates/contracts-template
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run tests with gas reporting
        run: pnpm test
        env:
          REPORT_GAS: 'true'
          CI: 'true'

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: Makalu/templates/contracts-template/gas-report.txt
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Solidity test coverage (hardhat solidity-coverage)
  # ─────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      # solidity-coverage is bundled inside @nomicfoundation/hardhat-toolbox
      - name: Run solidity-coverage
        # Coverage will sometimes fail on optimizer settings or memory limits;
        # treat the gate as advisory until baseline coverage is established.
        continue-on-error: true
        run: pnpm test:coverage

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            stmts=$(jq -r '.total.statements.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            branch=$(jq -r '.total.branches.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            funcs=$(jq -r '.total.functions.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            lines=$(jq -r '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "?")
            echo "## Solidity Coverage (Makalu/contracts)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Stmts % | Branch % | Funcs % | Lines % |" >> $GITHUB_STEP_SUMMARY
            echo "|--------:|---------:|--------:|--------:|" >> $GITHUB_STEP_SUMMARY
            echo "| $stmts | $branch | $funcs | $lines |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Solidity Coverage" >> $GITHUB_STEP_SUMMARY
            echo "_No coverage-summary.json found._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: |
            Makalu/contracts/coverage/
            Makalu/contracts/coverage.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Static analysis with Slither
  # ─────────────────────────────────────────────────────────────────────
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: compile
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./Makalu/templates/contracts-template
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile contracts (required by Slither)
        run: npx hardhat compile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        run: slither . --config-file .slither.config.json || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Makalu/templates/contracts-template/slither-report.sarif
        continue-on-error: true

      - name: Upload Slither JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            Makalu/templates/contracts-template/slither-report.json
            Makalu/templates/contracts-template/slither-report.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Static analysis with Slither — PRODUCTION contracts.
  # The existing `slither` job above analyses the developer-facing
  # contracts-template; this one targets the real LEP100 / WLITHO /
  # LITHONative contracts deployed on Makalu. Same advisory-then-blocking
  # pattern as Trivy: findings upload to the Security tab under category
  # `slither-production` for triage; the job is `continue-on-error: true`
  # while we walk down the first-scan baseline. Flip to blocking once the
  # baseline is clean (config already has `fail_on: high`).
  # ─────────────────────────────────────────────────────────────────────
  slither-production:
    name: Slither Analysis (production contracts)
    runs-on: ubuntu-latest
    needs: compile
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile contracts (required by Slither)
        run: pnpm compile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: 'Run Slither (blocking on fail_on: high)'
        # Flipped from advisory to blocking 2026-05-12 after the baseline
        # run on production contracts surfaced 0 alerts. `.slither.config.json`
        # has `fail_on: high`, so any future HIGH-severity finding now
        # gates the merge. Lower-severity findings continue to upload to
        # the Security tab (category `slither-production`) for triage.
        run: slither . --config-file .slither.config.json

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('Makalu/contracts/slither-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Makalu/contracts/slither-report.sarif
          # Distinct category so production findings show up separately
          # from the template ones (which post under the default
          # codeql-uploaded category).
          category: slither-production
        continue-on-error: true

      - name: Upload Slither JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report-production
          path: |
            Makalu/contracts/slither-report.json
            Makalu/contracts/slither-report.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Export compiled ABIs as build artifacts
  # ─────────────────────────────────────────────────────────────────────
  contract-artifacts:
    name: Contract Artifacts (ABI + bytecode)
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile
        run: pnpm compile

      # Extract ABI + bytecode + deployedBytecode + linkReferences from every
      # contract artifact under artifacts/src/. Three outputs per contract:
      #   - {name}.abi.json           — for SDK consumers + verification tools
      #   - {name}.bytecode.json      — creation bytecode + link refs (deploy)
      #   - {name}.full.json          — combined record (deploy + verify in one)
      # The glob target is `artifacts/src/*.sol/*.json` — Hardhat puts compiled
      # output at that path; an earlier version of this step used the
      # `artifacts/contracts/src/...` path which doesn't exist and silently
      # produced no files.
      - name: Extract ABI + bytecode artifacts
        run: |
          set -e
          mkdir -p artifacts-export
          count=0
          # `find` handles nested src/ subdirectories (e.g. src/libs/Strings.sol)
          # that a single-level shell glob would miss. -not lets us skip .dbg.json
          # debugging-source-map files emitted alongside each artifact.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .json)
            node -e "
              const a = JSON.parse(require('fs').readFileSync('$f', 'utf8'));
              const fs = require('fs');
              fs.writeFileSync('artifacts-export/${name}.abi.json', JSON.stringify(a.abi, null, 2));
              fs.writeFileSync('artifacts-export/${name}.bytecode.json', JSON.stringify({
                bytecode: a.bytecode,
                deployedBytecode: a.deployedBytecode,
                linkReferences: a.linkReferences,
                deployedLinkReferences: a.deployedLinkReferences,
              }, null, 2));
              fs.writeFileSync('artifacts-export/${name}.full.json', JSON.stringify({
                contractName: a.contractName,
                abi: a.abi,
                bytecode: a.bytecode,
                deployedBytecode: a.deployedBytecode,
                linkReferences: a.linkReferences,
                deployedLinkReferences: a.deployedLinkReferences,
              }, null, 2));
            "
            count=$((count + 1))
            echo "  $name → abi.json + bytecode.json + full.json"
          done < <(find artifacts/src -type f -name '*.json' -not -name '*.dbg.json')
          if [ "$count" -eq 0 ]; then
            echo "::error::No contract artifacts found at artifacts/src/*.sol/*.json — did Hardhat compile?"
            exit 1
          fi
          echo "Exported $count contract(s)."

      - name: Generate manifest
        # A small index.json so consumers know what's in the artifact bundle
        # without having to list directory contents. Includes a short SHA + a
        # timestamp + the SPDX list of names so cosign verification / signed
        # release flows can cross-reference.
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('artifacts-export').filter(f => f.endsWith('.full.json'));
            const contracts = files.map(f => {
              const json = JSON.parse(fs.readFileSync(path.join('artifacts-export', f), 'utf8'));
              return {
                name: json.contractName,
                methods: (json.abi || []).filter(x => x.type === 'function').length,
                events: (json.abi || []).filter(x => x.type === 'event').length,
                bytecodeBytes: json.bytecode ? (json.bytecode.length - 2) / 2 : 0,
              };
            });
            const manifest = {
              schemaVersion: 1,
              generatedAt: new Date().toISOString(),
              gitSha: process.env.GITHUB_SHA || 'local',
              contracts,
            };
            fs.writeFileSync('artifacts-export/index.json', JSON.stringify(manifest, null, 2));
            console.log('manifest:', JSON.stringify(manifest, null, 2));
          "

      - name: Upload contract artifacts bundle
        uses: actions/upload-artifact@v4
        with:
          # Keep `contract-abis` as a legacy-compatible name for now —
          # downstream consumers (if any) won't break on the rename. The
          # bundle includes everything: abi.json + bytecode.json + full.json + index.json.
          name: contract-abis
          path: Makalu/contracts/artifacts-export/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────
  # ABI Drift Gate — fail if the SDK's vendored ABIs don't match the
  # freshly compiled contract artifacts. Prevents shipping an
  # @lithosphere/blockchain-core release that's out of sync with the
  # Solidity source. Fix-it instructions are in the failure log.
  # ─────────────────────────────────────────────────────────────────────
  abi-sync-check:
    name: ABI Sync Check
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: ./Makalu/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile
        run: pnpm compile

      - name: Sync ABIs from artifacts to SDK
        run: pnpm run sync-abis

      - name: Verify no drift
        run: |
          # Print any drift before failing so the log shows what changed.
          if ! git diff --exit-code -- ../packages/blockchain-core/src/abis/; then
            echo ""
            echo "::error::ABI drift detected: @lithosphere/blockchain-core ships ABIs that don't match the compiled Solidity sources."
            echo ""
            echo "To fix:"
            echo "  cd Makalu/contracts"
            echo "  pnpm run sync-abis"
            echo "  git add ../packages/blockchain-core/src/abis/"
            echo "  git commit -m 'chore(sdk): re-sync ABIs from contracts'"
            exit 1
          fi
          echo "ABIs in sync."
