# ============================================================================
# Lithosphere — Build & Publish Docker Images to GHCR
# Publishes: api, indexer, explorer, faucet
# Registry:  ghcr.io/kajlabs/lithosphere-{api,indexer,explorer,faucet}
# Tags:      latest, mainnet, sha-<short>
# ============================================================================

name: Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'Makalu/api/**'
      - 'Makalu/indexer/**'
      - 'Makalu/explorer/**'
      - 'Makalu/faucet/**'
      - 'Makalu/scripts/vps1-ci-deploy.sh'
      - 'Makalu/scripts/vps1-ci-rollback.sh'
      - '.github/workflows/deploy-simple.yaml'
      - '.github/workflows/publish-images.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to apply (e.g. mainnet, v1.0.0)'
        required: false
        default: 'mainnet'
      service:
        description: 'Service to build (api, indexer, explorer, faucet, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - indexer
          - explorer
          - faucet

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write    # For Cosign keyless signing + SLSA provenance OIDC
      security-events: write    # For Trivy SARIF upload
      attestations: write    # For SLSA build-provenance attestations

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: ghcr.io/kajlabs/lithosphere-api
            context: ./Makalu/api
            dockerfile: ./Makalu/api/Dockerfile

          - service: indexer
            image: ghcr.io/kajlabs/lithosphere-indexer
            context: ./Makalu/indexer
            dockerfile: ./Makalu/indexer/Dockerfile

          - service: explorer
            image: ghcr.io/kajlabs/lithosphere-explorer
            context: ./Makalu/explorer
            dockerfile: ./Makalu/explorer/Dockerfile

          - service: faucet
            image: ghcr.io/kajlabs/lithosphere-faucet
            context: ./Makalu/faucet
            dockerfile: ./Makalu/faucet/Dockerfile

    steps:
      - name: Checkout
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: docker/setup-buildx-action@v3

      - name: Compute build metadata
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        id: build_meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Prefer tag refs for VERSION, fall back to short SHA
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag || 'mainnet' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally first so the CRITICAL gate runs before anything is pushed.
      # Explorer requires NEXT_PUBLIC_* vars baked in at build time.
      - name: Build security candidate — explorer
        id: build_explorer
        if: matrix.service == 'explorer' && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: lithosphere-${{ matrix.service }}:scan-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://makalu.litho.ai/api
            NEXT_PUBLIC_GRAPHQL_URL=https://makalu.litho.ai/api/graphql
            NEXT_PUBLIC_RPC_URL=https://rpc.litho.ai
            NEXT_PUBLIC_CHAIN_ID=700777
            NEXT_PUBLIC_CHAIN_NAME=Lithosphere
            NEXT_PUBLIC_SITE_URL=https://makalu.litho.ai
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # API, Indexer and Faucet — build metadata only
      - name: Build security candidate — ${{ matrix.service }}
        id: build
        if: matrix.service != 'explorer' && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: lithosphere-${{ matrix.service }}:scan-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan — HIGH/CRITICAL findings uploaded to GitHub Security tab for triage (non-blocking)
      - name: Trivy scan (visibility — HIGH + CRITICAL to SARIF)
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: lithosphere-${{ matrix.service }}:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service) && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      # Hard gate — fail the publish only on fixable CRITICAL CVEs
      - name: Trivy gate (CRITICAL — blocks publish)
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: lithosphere-${{ matrix.service }}:scan-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Publish — explorer
        id: publish_explorer
        if: matrix.service == 'explorer' && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://makalu.litho.ai/api
            NEXT_PUBLIC_GRAPHQL_URL=https://makalu.litho.ai/api/graphql
            NEXT_PUBLIC_RPC_URL=https://rpc.litho.ai
            NEXT_PUBLIC_CHAIN_ID=700777
            NEXT_PUBLIC_CHAIN_NAME=Lithosphere
            NEXT_PUBLIC_SITE_URL=https://makalu.litho.ai
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish — ${{ matrix.service }}
        id: publish
        if: matrix.service != 'explorer' && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest || steps.publish_explorer.outputs.digest }}
        run: |
          if [ -n "$IMAGE_DIGEST" ]; then
            cosign sign --yes ${{ matrix.image }}@${IMAGE_DIGEST}
            echo "✅ Image signed: ${{ matrix.image }}@${IMAGE_DIGEST}"
          else
            echo "⚠️  Could not get digest for signing — skipping"
          fi

      # SLSA build-provenance attestation. Generates an in-toto SLSA
      # Provenance v1.0 statement signed via the GitHub Actions OIDC token,
      # binding the published image digest to the exact workflow run +
      # source commit + build invocation that produced it. Stored as a
      # registry attestation reachable via:
      #   gh attestation verify oci://<image>@<digest> --owner KaJLabs
      # Lifts the SLSA posture from "image is signed (Cosign keyless)" to
      # "image carries a verifiable build provenance" (SLSA build L2).
      - name: Generate SLSA build provenance attestation
        if: (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service) && (steps.publish.outputs.digest || steps.publish_explorer.outputs.digest)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest || steps.publish_explorer.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}@${{ steps.publish.outputs.digest || steps.publish_explorer.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
        continue-on-error: true

      - name: Upload SBOM
        if: always() && (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Output image tags
        if: github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.service
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest || steps.publish_explorer.outputs.digest }}
        run: |
          echo "## Image Published: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ matrix.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${IMAGE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | while read tag; do
            echo "- \`${tag}\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verify signature (Cosign keyless):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ${{ matrix.image }}@${IMAGE_DIGEST} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp 'https://github.com/KaJLabs/Lithosphere/.+' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verify SLSA build provenance:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ matrix.image }}@${IMAGE_DIGEST} --owner KaJLabs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
