name: Publish immutable MultX security images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: multx-signer
            context: MultX/signer
          - name: multx-totp-envelope
            context: MultX/totp-envelope
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/kajlabs/lithosphere/${{ matrix.name }}:sha-${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kajlabs/lithosphere/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable digest
        run: echo '${{ matrix.name }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
