name: Publish immutable MultX security images

on:
  workflow_dispatch:
  push:
    tags:
      - "multx-security-images-*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: MultX/signer
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/kajlabs/lithosphere/multx-signer:sha-${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kajlabs/lithosphere/multx-signer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable digest
        run: echo 'multx-signer@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
