name: Lithoscan Mainnet Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makalu/api/**'
      - 'Makalu/indexer/**'
      - 'Makalu/explorer/**'
      - 'Makalu/docker-compose.mainnet.yaml'
      - '.github/workflows/mainnet-build.yaml'

concurrency:
  group: lithoscan-mainnet-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            image: ghcr.io/kajlabs/lithoscan-api
            context: ./Makalu/api
            dockerfile: ./Makalu/api/Dockerfile
          - service: indexer
            image: ghcr.io/kajlabs/lithoscan-indexer
            context: ./Makalu/indexer
            dockerfile: ./Makalu/indexer/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=lithoscan-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lithoscan-${{ matrix.service }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  explorer:
    name: Build explorer (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: staging
            site_url: https://staging.lithoscan.ai
          - target: mainnet
            site_url: https://lithoscan.ai
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          echo "tag=${{ matrix.target }}-sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./Makalu/explorer
          file: ./Makalu/explorer/Dockerfile
          push: true
          tags: ghcr.io/kajlabs/lithoscan-explorer:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_NETWORK=mainnet
            NEXT_PUBLIC_CHAIN_ID=9005
            NEXT_PUBLIC_COSMOS_CHAIN_ID=lithosphere_9005-1
            NEXT_PUBLIC_CHAIN_NAME=Lithosphere Mainnet
            NEXT_PUBLIC_RPC_URL=https://rpc-mainnet.litho.ai
            NEXT_PUBLIC_SITE_URL=${{ matrix.site_url }}
            NEXT_PUBLIC_EXPLORER_TITLE=Lithoscan
            NEXT_PUBLIC_DEFAULT_THEME=light
            NEXT_PUBLIC_BRIDGE_ENABLED=false
            NEXT_PUBLIC_SWAP_ROUTER=
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=lithoscan-explorer-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=lithoscan-explorer-${{ matrix.target }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kajlabs/lithoscan-explorer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  summary:
    runs-on: ubuntu-latest
    needs: [services, explorer]
    steps:
      - run: |
          echo "## Lithoscan immutable image set" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: \`sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging explorer: \`staging-sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mainnet explorer: \`mainnet-sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
