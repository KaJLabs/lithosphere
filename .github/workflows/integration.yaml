# Dockerized integration tests — boots ephemeral Postgres and exercises the
# api layer end-to-end against real SQL. Auto-fires on PRs that touch the
# api, indexer, or the integration test corpus. `workflow_dispatch` stays
# for manual baseline runs (e.g. when editing chain-state.json without
# touching service code). The `pull_request: types: [labeled]` trigger
# was promoted to a path-based PR gate on 2026-05-12 once the workflow
# was proven end-to-end (sslmode=disable fix; chain-state fixture corpus).
# Skips on docs / workflow-only PRs to keep CI time bounded — ~1 min added.

name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Makalu/api/**'
      - 'Makalu/indexer/**'
      - 'Makalu/docker-compose.test.yml'
      - '.github/workflows/integration.yaml'

permissions:
  contents: read

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litho
          POSTGRES_PASSWORD: litho
          POSTGRES_DB: litho_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U litho -d litho_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Build api + indexer
        working-directory: ./Makalu
        run: pnpm turbo run build --filter '@lithosphere/api' --filter '@lithosphere/indexer'

      - name: Run integration tests (api)
        working-directory: ./Makalu/api
        env:
          INTEGRATION_TESTS: '1'
          # `sslmode=disable` is required — Makalu/api/src/db.ts defaults
          # to SSL with rejectUnauthorized:false unless this is explicit,
          # and the ephemeral postgres:16-alpine service doesn't speak SSL.
          # Without it every integration test fails with
          # "Error: The server does not support SSL connections".
          DATABASE_URL: postgres://litho:litho@localhost:5433/litho_test?sslmode=disable
          CI: true
        run: pnpm vitest run src/__tests__/integration
