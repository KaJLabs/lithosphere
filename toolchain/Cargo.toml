[workspace]
resolver = "2"
members = [
    "crates/lithic-syntax",
    "crates/lithc",
    "crates/lithfmt",
    "crates/lithlint",
    "crates/lithls",
    "crates/lithdev",
    "crates/lithtest",
    "crates/lithsec",
    "crates/lithpkg",
    "crates/litho-pq-conformance",
]

# The user-facing scaffold crates remain std-only. The isolated, disabled
# `litho-pq-conformance` candidate uses exact pinned cryptographic dependencies
# and is not linked into any shipped tool or runtime.
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/KaJLabs/lithosphere"
