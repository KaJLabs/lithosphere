# LITHO mainnet (EVM 9005 / Cosmos lithosphere_9005-1)
# VPS-only topology. AWS resources are intentionally excluded.

[validators]
mainnet-val-01 ansible_host=REPLACE_WITH_PRIVATE_VALIDATOR_HOST

[sentries]
mainnet-sentry-01 ansible_host=REPLACE_WITH_PRIVATE_SENTRY1_HOST
mainnet-sentry-02 ansible_host=REPLACE_WITH_PRIVATE_SENTRY2_HOST

[mainnet_nodes:children]
validators
sentries

[litho_nodes:children]
mainnet_nodes

[all:vars]
ansible_user=REPLACE_WITH_PRIVATE_ADMIN_USER
ansible_ssh_private_key_file=REPLACE_WITH_PRIVATE_KEY_PATH
ansible_ssh_common_args='-o BatchMode=yes -o StrictHostKeyChecking=yes'
