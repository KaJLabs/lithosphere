# #############################################################################
# 9. GOVERNANCE WATCHER (Calendar Hooks + Telegram Notifications)
# #############################################################################

- name: Create governance state directory
  file:
    path: /var/lib/litho/governance
    state: directory
    owner: "{{ litho_user }}"
    group: "{{ litho_group }}"
    mode: '0750'
  tags: [governance, monitoring]

- name: Create governance environment file
  copy:
    dest: /etc/litho/governance.env
    owner: root
    group: "{{ litho_group }}"
    mode: '0640'
    content: |
      # Governance Watcher Configuration
      # Managed by Ansible — do not edit manually
      TELEGRAM_BOT_TOKEN={{ governance_telegram_bot_token | default('PLACEHOLDER_BOT_TOKEN') }}
      TELEGRAM_CHAT_ID={{ governance_telegram_chat_id | default('PLACEHOLDER_CHAT_ID') }}
      GOVERNANCE_API={{ governance_api_endpoint | default('https://api.litho.ai') }}
      VALIDATOR_OPER={{ governance_validator_oper | default('lithovaloper1jvp5v362quy9mwhg0zsghjky8xt2y8vtlekc4w') }}
      GOVERNANCE_STATE=/var/lib/litho/governance/watcher_state.json
  tags: [governance, monitoring]

- name: Deploy governance-watcher.sh
  copy:
    src: "{{ playbook_dir }}/../../scripts/governance-watcher.sh"
    dest: /usr/local/bin/governance-watcher.sh
    owner: root
    group: root
    mode: '0755'
  tags: [governance, monitoring]

- name: Deploy governance-vote.sh
  copy:
    src: "{{ playbook_dir }}/../../scripts/governance-vote.sh"
    dest: /usr/local/bin/governance-vote.sh
    owner: root
    group: root
    mode: '0755'
  tags: [governance, monitoring]

- name: Deploy governance-watcher systemd service
  template:
    src: governance-watcher.service.j2
    dest: /etc/systemd/system/governance-watcher.service
    owner: root
    group: root
    mode: '0644'
  tags: [governance, monitoring]

- name: Deploy governance-watcher systemd timer
  template:
    src: governance-watcher.timer.j2
    dest: /etc/systemd/system/governance-watcher.timer
    owner: root
    group: root
    mode: '0644'
  tags: [governance, monitoring]

- name: Enable and start governance-watcher timer
  systemd:
    name: governance-watcher.timer
    state: started
    enabled: yes
    daemon_reload: yes
  tags: [governance, monitoring]

- name: Run initial governance watcher check
  command: /usr/local/bin/governance-watcher.sh --verbose
  become: yes
  become_user: "{{ litho_user }}"
  register: initial_watcher_run
  failed_when: false
  changed_when: false
  tags: [governance, monitoring]
