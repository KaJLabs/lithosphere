---
# ============================================================================
# Fetch Encrypted Keys from AWS Secrets Manager
# ============================================================================
#
# Retrieves KMS-encrypted validator/node keys uploaded by key-ceremony.sh.
# - Validator signing key: writes .enc and .kms files for decrypt/wipe lifecycle
# - Node key: writes plaintext node_key.json (P2P identity, not signing key)
# - Initial validator state: creates priv_validator_state.json if missing
#
# All sensitive operations use no_log: true
#
# Tags: security, keys
# ============================================================================

# --------------------------------------------------------------------------
# VALIDATOR SIGNING KEY (from Secrets Manager → .enc + .kms files)
# --------------------------------------------------------------------------

- name: Check if encrypted validator key already exists on disk
  stat:
    path: "{{ litho_home }}/config/priv_validator_key.json.enc"
  register: existing_encrypted_key
  when: node_role == "validator"
  tags: [security, keys]

- name: Fetch validator signing key from Secrets Manager
  block:
    - name: Retrieve validator signing key secret
      shell: |
        aws secretsmanager get-secret-value \
          --secret-id "{{ secrets_validator_signing_key }}" \
          --region "{{ aws_region }}" \
          --query 'SecretString' \
          --output text
      register: validator_secret_raw
      no_log: true
      changed_when: false
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"

    - name: Parse validator secret JSON
      set_fact:
        validator_secret: "{{ validator_secret_raw.stdout | from_json }}"
      no_log: true

    - name: Verify secret contains required fields
      assert:
        that:
          - validator_secret.encrypted_key_b64 is defined
          - validator_secret.encrypted_data_key_b64 is defined
          - validator_secret.encrypted_key_b64 | length > 0
          - validator_secret.encrypted_data_key_b64 | length > 0
        fail_msg: >-
          Validator signing key secret is missing required fields.
          Run scripts/key-ceremony.sh --node-type validator first.

    - name: Write encrypted validator key (.enc) to disk
      copy:
        content: "{{ validator_secret.encrypted_key_b64 | b64decode }}"
        dest: "{{ litho_home }}/config/priv_validator_key.json.enc"
        owner: "{{ litho_user }}"
        group: "{{ litho_group }}"
        mode: "0600"
      no_log: true

    - name: Write encrypted data key (.kms) to disk
      copy:
        content: "{{ validator_secret.encrypted_data_key_b64 }}"
        dest: "{{ litho_home }}/config/priv_validator_key.kms"
        owner: "{{ litho_user }}"
        group: "{{ litho_group }}"
        mode: "0600"
      no_log: true

    - name: Record validator public info for peer configuration
      set_fact:
        validator_pubkey: "{{ validator_secret.public_key.value | default('') }}"
        validator_address: "{{ validator_secret.address | default('') }}"
        validator_node_id: "{{ validator_secret.node_id | default('') }}"

    - name: Display validator public info (non-sensitive)
      debug:
        msg: >-
          Validator signing key retrieved from Secrets Manager:
          Address={{ validator_address }}
          PubKey={{ validator_pubkey }}
          NodeID={{ validator_node_id }}
          Source={{ secrets_validator_signing_key }}

  when:
    - node_role == "validator"
    - not (existing_encrypted_key.stat.exists | default(false))
  tags: [security, keys]

# --------------------------------------------------------------------------
# NODE KEY (from Secrets Manager → plaintext node_key.json)
# --------------------------------------------------------------------------
# Node keys are P2P identity keys (not signing keys).
# They are encrypted in transit (Secrets Manager) but written as plaintext
# on disk because CometBFT reads node_key.json directly.
# --------------------------------------------------------------------------

- name: Check if node_key.json already exists on disk
  stat:
    path: "{{ litho_home }}/config/node_key.json"
  register: existing_node_key
  tags: [security, keys]

- name: Fetch node key from Secrets Manager
  block:
    - name: Determine node name in secrets
      set_fact:
        secret_node_name: "{{ node_role if node_role == 'validator' else inventory_hostname_short | default(inventory_hostname) }}"

    - name: Retrieve node keys secret
      shell: |
        aws secretsmanager get-secret-value \
          --secret-id "{{ secrets_node_keys }}" \
          --region "{{ aws_region }}" \
          --query 'SecretString' \
          --output text
      register: node_keys_secret_raw
      no_log: true
      changed_when: false
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"

    - name: Parse node keys secret
      set_fact:
        node_keys_secret: "{{ node_keys_secret_raw.stdout | from_json }}"
      no_log: true

    - name: Verify node entry exists in secret
      assert:
        that:
          - node_keys_secret.nodes is defined
          - node_keys_secret.nodes[secret_node_name] is defined
        fail_msg: >-
          No node key found for '{{ secret_node_name }}' in {{ secrets_node_keys }}.
          Run scripts/key-ceremony.sh --node-type {{ secret_node_name }} first.

    - name: Extract this node's key data
      set_fact:
        my_node_key_data: "{{ node_keys_secret.nodes[secret_node_name] }}"
      no_log: true

    - name: Decrypt node key from envelope encryption
      shell: |
        set -euo pipefail

        TMPDK=$(mktemp /tmp/node_dk_XXXXXXXXXX.bin)
        trap 'shred -fz -n 10 "$TMPDK" 2>/dev/null; rm -f "$TMPDK"' EXIT

        # Decrypt the data key via KMS
        echo "{{ my_node_key_data.encrypted_data_key_b64 }}" | \
          base64 -d > "${TMPDK}.enc"

        aws kms decrypt \
          --ciphertext-blob "fileb://${TMPDK}.enc" \
          --region "{{ aws_region }}" \
          --query 'Plaintext' \
          --output text | base64 -d > "$TMPDK"

        rm -f "${TMPDK}.enc"

        # Decrypt the node key
        echo "{{ my_node_key_data.encrypted_key_b64 }}" | \
          base64 -d > "${TMPDK}.key.enc"

        openssl enc -d -aes-256-cbc -salt -pbkdf2 \
          -in "${TMPDK}.key.enc" \
          -out "{{ litho_home }}/config/node_key.json" \
          -pass "file:${TMPDK}"

        rm -f "${TMPDK}.key.enc"

        # Validate output is valid JSON
        jq empty "{{ litho_home }}/config/node_key.json"
      args:
        executable: /bin/bash
      no_log: true
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"

    - name: Set node_key.json permissions
      file:
        path: "{{ litho_home }}/config/node_key.json"
        owner: "{{ litho_user }}"
        group: "{{ litho_group }}"
        mode: "0600"

    - name: Record node ID for peer configuration
      set_fact:
        my_node_id: "{{ my_node_key_data.node_id }}"

    - name: Display node public info (non-sensitive)
      debug:
        msg: >-
          Node key retrieved from Secrets Manager:
          NodeID={{ my_node_id }}
          Source={{ secrets_node_keys }}[{{ secret_node_name }}]

  when:
    - not (existing_node_key.stat.exists | default(false))
  tags: [security, keys]

# --------------------------------------------------------------------------
# INITIAL VALIDATOR STATE
# --------------------------------------------------------------------------

- name: Create initial priv_validator_state.json if missing
  copy:
    content: |
      {
        "height": "0",
        "round": 0,
        "step": 0
      }
    dest: "{{ litho_home }}/data/priv_validator_state.json"
    owner: "{{ litho_user }}"
    group: "{{ litho_group }}"
    mode: "0600"
    force: false
  when: node_role == "validator"
  tags: [security, keys]

# --------------------------------------------------------------------------
# VERIFICATION
# --------------------------------------------------------------------------

- name: Verify encrypted validator key files on disk
  block:
    - name: Stat encrypted key file
      stat:
        path: "{{ litho_home }}/config/priv_validator_key.json.enc"
      register: verify_enc

    - name: Stat encrypted data key file
      stat:
        path: "{{ litho_home }}/config/priv_validator_key.kms"
      register: verify_kms

    - name: Assert encrypted files exist
      assert:
        that:
          - verify_enc.stat.exists
          - verify_kms.stat.exists
        fail_msg: "Encrypted validator key files not found after Secrets Manager fetch"

    - name: Test decryption round-trip
      shell: |
        set -euo pipefail
        {{ litho_home }}/scripts/decrypt_validator_key.sh
        ADDR=$(jq -r '.address' {{ litho_home }}/config/priv_validator_key.json)
        {{ litho_home }}/scripts/wipe_validator_key.sh
        echo "$ADDR"
      register: decrypt_test
      no_log: true
      changed_when: false

    - name: Assert decryption round-trip succeeded
      assert:
        that:
          - decrypt_test.rc == 0
          - decrypt_test.stdout | length > 0
        fail_msg: "Decryption round-trip test FAILED - validator key cannot be decrypted"

    - name: Display verification result
      debug:
        msg: "Validator key decryption round-trip: PASSED"

  when: node_role == "validator"
  tags: [security, keys, verify]

- name: Verify node_key.json on disk
  block:
    - name: Stat node key file
      stat:
        path: "{{ litho_home }}/config/node_key.json"
      register: verify_node_key

    - name: Assert node key exists
      assert:
        that:
          - verify_node_key.stat.exists
        fail_msg: "node_key.json not found after Secrets Manager fetch"

    - name: Validate node key is valid JSON
      shell: jq empty {{ litho_home }}/config/node_key.json
      changed_when: false

    - name: Display node key verification result
      debug:
        msg: "Node key verification: PASSED"

  tags: [security, keys, verify]
