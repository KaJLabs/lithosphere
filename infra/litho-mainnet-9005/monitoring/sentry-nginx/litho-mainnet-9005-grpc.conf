# LITHO mainnet gRPC TLS proxy on sentry 2.
# grpc-mainnet.litho.ai:9090 -> local mainnet gRPC 127.0.0.1:9490.

upstream litho_mainnet_grpc {
    server 127.0.0.1:9490;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name grpc-mainnet.litho.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}

server {
    listen 9090 ssl;
    listen [::]:9090 ssl;
    http2 on;
    server_name grpc-mainnet.litho.ai;

    ssl_certificate /etc/letsencrypt/live/litho-mainnet-grpc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litho-mainnet-grpc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LITHOMainnetGRPCTLS:10m;
    ssl_session_timeout 1d;

    location / {
        grpc_pass grpc://litho_mainnet_grpc;
        grpc_connect_timeout 3s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }
}
