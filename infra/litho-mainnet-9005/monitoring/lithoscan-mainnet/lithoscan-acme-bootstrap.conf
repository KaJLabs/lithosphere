# HTTP-only ACME bootstrap for lithoscan.ai. It is safe to enable before the
# production TLS vhost and does not route application traffic to mainnet.
server {
    listen 80;
    listen [::]:80;
    server_name lithoscan.ai;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://lithoscan.ai$request_uri;
    }
}
