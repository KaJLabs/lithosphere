# Install only on the dedicated staging edge after staging DNS is approved.
server {
    listen 443 ssl http2;
    server_name staging.lithoscan.ai;

    ssl_certificate /etc/letsencrypt/live/staging.lithoscan.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.lithoscan.ai/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:4401;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
