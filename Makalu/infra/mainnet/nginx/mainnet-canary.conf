# Private/corporate-access canary for production verification before DNS cutover.
# Replace the server_name and certificate paths with the protected canary values.
server {
    listen 443 ssl http2;
    server_name mainnet-canary.lithoscan.ai;

    ssl_certificate /etc/letsencrypt/live/mainnet-canary.lithoscan.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mainnet-canary.lithoscan.ai/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
