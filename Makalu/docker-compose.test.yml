# Ephemeral Postgres for integration tests.
#
# Use:
#   docker compose -f docker-compose.test.yml up -d postgres
#   INTEGRATION_TESTS=1 \
#     DATABASE_URL=postgres://litho:litho@localhost:5433/litho_test \
#     pnpm --filter @lithosphere/api test
#   docker compose -f docker-compose.test.yml down -v
#
# CI invokes this via .github/workflows/integration.yaml.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litho
      POSTGRES_PASSWORD: litho
      POSTGRES_DB: litho_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litho -d litho_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
