# Historical Makalu/Kamet integration stack. This is deliberately named
# testnet: it contains testnet chain IDs and deployments and must not be used
# as a LITHO mainnet production manifest.

services:
  bridge-postgres:
    image: postgres:16-alpine
    container_name: bridge-postgres
    environment:
      POSTGRES_USER: bridge_user
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD:?BRIDGE_DB_PASSWORD is required}
      POSTGRES_DB: bridge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_user -d bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bridge-network
    restart: unless-stopped

  bridge-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: bridge-api
    depends_on:
      bridge-postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: bridge-postgres
      DB_PORT: 5432
      DB_USER: bridge_user
      DB_PASSWORD: ${BRIDGE_DB_PASSWORD:?BRIDGE_DB_PASSWORD is required}
      DB_NAME: bridge
      CORS_ORIGINS: https://kamet.litho.ai,https://bridge.litho.ai,http://localhost:3002
      LITHO_RPC_WS: ${LITHO_RPC_WS:-wss://rpc-3.litho.ai:8546}
      LITHO_RPC_HTTP: ${LITHO_RPC_HTTP:-https://rpc-3.litho.ai}
      BRIDGE_CONTRACT_ADDRESS: ${MULTX_BRIDGE_ADDRESS:-0x3a896BDF3a1088287FA84aB5a43bB30e2535F263}
      BRIDGE_CONTRACT_SEPOLIA: ${BRIDGE_CONTRACT_SEPOLIA:-0xfdA3b83FE8438123eAF5153945A46F8fcF6175f4}
      BRIDGE_CONTRACT_BASE_SEPOLIA: ${BRIDGE_CONTRACT_BASE_SEPOLIA:-0xfdA3b83FE8438123eAF5153945A46F8fcF6175f4}
      BRIDGE_CONTRACT_BNB: ${BRIDGE_CONTRACT_BNB:-0x93d74580a7b63a5B1FE5Aae05b7470bf9317aF9A}
      MOCK_VALIDATOR_COUNT: ${MOCK_VALIDATOR_COUNT:-0}
      MOCK_SIGNATURES_REQUIRED: ${MOCK_SIGNATURES_REQUIRED:-0}
      MOCK_SIGN_DELAY_MS: ${MOCK_SIGN_DELAY_MS:-5000}
    ports:
      - "127.0.0.1:4001:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bridge-network
    restart: unless-stopped

  kamet:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_RPC_URL: ${KAMET_RPC_URL:-https://rpc-3.litho.ai}
        VITE_REST_URL: ${KAMET_REST_URL:-https://api-3.litho.ai}
        VITE_GRPC_URL: ${KAMET_GRPC_URL:?KAMET_GRPC_URL is required}
        VITE_EVM_RPC_URL: ${KAMET_EVM_RPC_URL:-https://rpc-3.litho.ai}
        VITE_CHAIN_ID: ${KAMET_CHAIN_ID:-lithosphere_900523-1}
        VITE_CHAIN_NAME: Lithosphere Kamet
        VITE_DENOM: LITHO
        VITE_DECIMALS: "18"
        VITE_APP_NAME: Lithosphere Kamet
        VITE_APP_DESCRIPTION: "Explore blocks, transactions, validators, and accounts on Lithosphere Kamet"
        VITE_MULTX_BRIDGE_ADDRESS: ${MULTX_BRIDGE_ADDRESS:-0x95B646bF6629A379AD898DC58D011fd3111e5700}
        VITE_MULTX_API_URL: ${MULTX_API_URL:-https://kamet.litho.ai/bridge}
        VITE_LITHO_TOKEN_ADDRESS: ${LITHO_TOKEN_ADDRESS:-0x4D1fc3b424CF86aeF2B2fa503acf97eB1bFb88a2}
        VITE_LITHO_COINGECKO_ID: ${LITHO_COINGECKO_ID:-lithosphere}
    container_name: kamet-dashboard
    depends_on:
      bridge-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bridge-network
    restart: unless-stopped
    labels:
      - "app=kamet-explorer"
      - "environment=production"
      - "version=1.0.0"

networks:
  bridge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  bridge-postgres-data:
    driver: local
