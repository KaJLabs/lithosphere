# Foundry config — scoped to the MultX bridge contracts for invariant/fuzz
# testing. The Hardhat sources dir (contracts/) holds only the 6 bridge
# contracts (all solc 0.8.24); the DEX/DNNS trees live elsewhere and are not
# compiled here. Hardhat remains the primary unit-test runner; Foundry adds
# property-based coverage for the audit submission.
[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
cache_path = "cache_forge"          # keep separate from Hardhat's cache/
libs = ["lib", "node_modules"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false              # handler bounds calls; reverts are expected noise
